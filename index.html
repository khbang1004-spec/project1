<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Care Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <header class="hero">
    <p class="eyebrow">SEL 기반 수학 수업 도구</p>
    <h1>Math Care Studio</h1>
    <p class="hero-copy">학생은 자신의 누적 참여를 보고, 교사는 학급 전체 누적을 한눈에 확인할 수 있습니다.</p>
  </header>

  <main class="layout-single">
    <section class="card role-grid">
      <a class="role-card" data-page-link="student" href="student.html">
        <p class="role-label">STUDENT</p>
        <h2>학생 화면</h2>
        <p>교사가 공유한 링크로 감정 체크인, 오답 공감, 해빗 체크를 제출하고 내 누적 기록을 확인합니다.</p>
      </a>
      <a class="role-card" data-page-link="teacher-login" href="teacher-login.html">
        <p class="role-label">TEACHER</p>
        <h2>교사 화면</h2>
        <p>본인 Apps Script를 연결한 뒤 Google 인증으로 들어가, 자기 시트에 저장된 학급 데이터를 관리합니다.</p>
      </a>
    </section>
  </main>

  <footer class="footer-note">
    교사별 독립 시트 기반으로 배포 가능한 프로토타입
  </footer>

  <script src="app.js"></script>
</body>
</html>
