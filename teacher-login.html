<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교사 로그인 | Math Care Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="teacher-login">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <header class="hero">
    <div class="page-links">
      <a href="index.html">역할 선택</a>
      <a href="student.html">학생 화면</a>
    </div>
    <p class="eyebrow">교사 전용 접근</p>
    <h1>교사 로그인</h1>
    <p class="hero-copy">교사 PIN을 입력하면 대시보드에 접근할 수 있습니다.</p>
  </header>

  <main class="layout-single">
    <section class="card login-card">
      <form id="teacher-login-form" class="stack-gap">
        <label class="field-label" for="teacher-pin">교사 PIN</label>
        <input id="teacher-pin" type="password" inputmode="numeric" maxlength="12" placeholder="PIN 입력" required>
        <button class="primary-btn" type="submit">교사 대시보드 열기</button>
        <p id="teacher-login-feedback" class="feedback" aria-live="polite"></p>
      </form>
      <p class="section-copy">현재 프로토타입 기본 PIN은 2468 입니다. 배포 시 서버 인증으로 전환하세요.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
